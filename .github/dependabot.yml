# Dependency updates (SI-2). Twice a month (the 1st and 15th, 1 PM Eastern; Dependabot has
# no two-weekly interval), grouped, and only for releases at least 7 days old, matching the
# project's rule for choosing versions. Security updates for known vulnerabilities are
# separate (repository settings) and still arrive as soon as they're published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: '0 13 1,15 * *'
      timezone: America/New_York
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Majors held back on purpose (ADR-0008, ADR-0015). Minor and patch updates still arrive.
    ignore:
      # TypeScript 7: typescript-eslint and @astrojs/check don't support it yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Vitest 5: held under ADR-0015 for the Workers test pool, which Phase 2 didn't adopt
      # (tests use wrangler's getPlatformProxy). Lifting the hold is a dependency decision:
      # see docs/evidence/2026-11-07-repo-audit/README.md.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 13 1,15 * *'
      timezone: America/New_York
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
